name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "目标分支/标签/提交"
        required: true
        default: "main"
      create_release:
        description: "自动创建发布草稿"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      build_key:
        description: "构建标识，用于区分 tag 和安装包文件名，例如 main-chat 或 openai-responses-test"
        required: false
        default: ""
      build_label:
        description: "构建中文说明，会显示在 Release 和 Telegram 消息中"
        required: false
        default: ""
      release_notes:
        description: "Release 中文说明正文"
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_version.outputs.version }}
      app_name: ${{ steps.app_meta.outputs.app_name }}
      dist_dir_name: ${{ steps.app_meta.outputs.dist_dir_name }}
      macos_bundle_name: ${{ steps.app_meta.outputs.macos_bundle_name }}
      linux_desktop_name: ${{ steps.app_meta.outputs.linux_desktop_name }}
      linux_icon_name: ${{ steps.app_meta.outputs.linux_icon_name }}
      build_key: ${{ steps.build_meta.outputs.build_key }}
      asset_suffix: ${{ steps.build_meta.outputs.asset_suffix }}
      tag_suffix: ${{ steps.build_meta.outputs.tag_suffix }}
      release_label: ${{ steps.build_meta.outputs.release_label }}
      release_name_suffix: ${{ steps.build_meta.outputs.release_name_suffix }}
      release_body: ${{ steps.build_meta.outputs.release_body }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check Version
        id: check_version
        shell: bash
        run: |
          version=$(cat version.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync Dependencies
        shell: bash
        run: |
          uv sync

      - name: Resolve App Meta
        id: app_meta
        shell: bash
        run: |
          echo "app_name=LinguaGacha" >> "$GITHUB_OUTPUT"
          echo "dist_dir_name=LinguaGacha" >> "$GITHUB_OUTPUT"
          echo "macos_bundle_name=LinguaGacha.app" >> "$GITHUB_OUTPUT"
          echo "linux_desktop_name=linguagacha" >> "$GITHUB_OUTPUT"
          echo "linux_icon_name=linguagacha" >> "$GITHUB_OUTPUT"

      - name: Resolve Build Meta
        id: build_meta
        shell: bash
        env:
          RAW_BUILD_KEY: ${{ inputs.build_key }}
          BUILD_LABEL: ${{ inputs.build_label }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TARGET_REF: ${{ inputs.ref }}
          VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          build_key=$(printf '%s' "$RAW_BUILD_KEY" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          if [ -n "$build_key" ]; then
            echo "build_key=$build_key" >> "$GITHUB_OUTPUT"
            echo "asset_suffix=_$build_key" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=-$build_key" >> "$GITHUB_OUTPUT"
          else
            echo "build_key=" >> "$GITHUB_OUTPUT"
            echo "asset_suffix=" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
          fi

          release_label="$BUILD_LABEL"
          if [ -z "$release_label" ]; then
            release_label="$build_key"
          fi
          echo "release_label=$release_label" >> "$GITHUB_OUTPUT"
          if [ -n "$release_label" ]; then
            echo "release_name_suffix= - $release_label" >> "$GITHUB_OUTPUT"
          else
            echo "release_name_suffix=" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "release_body<<EOF"
            printf '构建说明：%s\n' "${release_label:-未填写}"
            printf '目标 ref：%s\n' "$TARGET_REF"
            printf '版本：%s\n' "$VERSION"
            if [ -n "$RELEASE_NOTES" ]; then
              printf '\n%s\n' "$RELEASE_NOTES"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync Dependencies
        shell: cmd
        run: |
          uv sync

      - name: Build EXE
        shell: cmd
        run: |
          uv run --with pyinstaller python .\buildtools\build_exe.py

      - name: Copy Files
        shell: cmd
        run: |
          xcopy ".\version.txt" ".\dist\${{ needs.prepare.outputs.dist_dir_name }}\" /Q /Y
          xcopy ".\resource\" ".\dist\${{ needs.prepare.outputs.dist_dir_name }}\resource\" /E /I /Q /H /Y

      - name: Ensure update.ps1 in package
        shell: pwsh
        run: |
          $src = ".\resource\update\update.ps1"
          $dst = ".\dist\${{ needs.prepare.outputs.dist_dir_name }}\resource\update\update.ps1"
          if (!(Test-Path $src)) { throw "Missing $src" }
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          Copy-Item $src $dst -Force

      - name: Compress Archive
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath "${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}.zip" -CompressionLevel Optimal -Force

      - name: Generate Windows ZIP SHA256
        shell: pwsh
        run: |
          $zip = "${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_Windows
          path: |
            ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}.zip
            ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}.zip.sha256

  build-macos:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync Dependencies
        run: |
          uv sync

      - name: Build App Bundle
        run: |
          uv run --with pyinstaller python ./buildtools/build_exe.py

      - name: Copy Resources
        run: |
          cp version.txt ./dist/${{ needs.prepare.outputs.macos_bundle_name }}/Contents/MacOS/
          cp -r resource ./dist/${{ needs.prepare.outputs.macos_bundle_name }}/Contents/MacOS/

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "${{ needs.prepare.outputs.app_name }}" \
            --volicon "./resource/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ needs.prepare.outputs.macos_bundle_name }}" 150 190 \
            --hide-extension "${{ needs.prepare.outputs.macos_bundle_name }}" \
            --app-drop-link 450 185 \
            "${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_${{ matrix.arch }}.dmg" \
            "./dist/${{ needs.prepare.outputs.macos_bundle_name }}" || true
          DMG_FILE="${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_${{ matrix.arch }}.dmg"
          if [ ! -f "$DMG_FILE" ]; then
            echo "ERROR: DMG file not created: $DMG_FILE"
            exit 1
          fi
          ls -la "$DMG_FILE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_${{ matrix.arch }}
          path: "*.dmg"

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0

      - name: Sync Dependencies
        run: |
          uv sync

      - name: Build Executable
        run: |
          uv run --with pyinstaller python ./buildtools/build_exe.py

      - name: Copy Resources
        run: |
          cp version.txt ./dist/${{ needs.prepare.outputs.dist_dir_name }}/
          cp -r resource ./dist/${{ needs.prepare.outputs.dist_dir_name }}/

      - name: Create AppImage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_SUFFIX: ${{ needs.prepare.outputs.asset_suffix }}
          APP_NAME: ${{ needs.prepare.outputs.app_name }}
          DIST_DIR_NAME: ${{ needs.prepare.outputs.dist_dir_name }}
          DESKTOP_NAME: ${{ needs.prepare.outputs.linux_desktop_name }}
          ICON_NAME: ${{ needs.prepare.outputs.linux_icon_name }}
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r "./dist/${DIST_DIR_NAME}/"* AppDir/usr/bin/

          cat > "AppDir/usr/share/applications/${DESKTOP_NAME}.desktop" << EOF
          [Desktop Entry]
          Name=${APP_NAME}
          Exec=${APP_NAME}
          Icon=${ICON_NAME}
          Type=Application
          Categories=Utility;
          EOF
          cp "AppDir/usr/share/applications/${DESKTOP_NAME}.desktop" AppDir/

          cp ./resource/icon.png "AppDir/usr/share/icons/hicolor/256x256/apps/${ICON_NAME}.png"
          cp ./resource/icon.png "AppDir/${ICON_NAME}.png"

          cat > AppDir/AppRun << EOF
          #!/bin/bash
          SELF=\$(readlink -f "\$0")
          HERE=\${SELF%/*}
          export PATH="\${HERE}/usr/bin:\${PATH}"
          export LD_LIBRARY_PATH="\${HERE}/usr/bin:\${LD_LIBRARY_PATH}"
          cd "\${HERE}/usr/bin"
          exec "\${HERE}/usr/bin/${APP_NAME}" "\$@"
          EOF
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "${APP_NAME}_${VERSION}${ASSET_SUFFIX}_Linux_x86_64.AppImage"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_Linux_x86_64
          path: "${{ needs.prepare.outputs.app_name }}_*.AppImage"

  create-release:
    needs: [prepare, build-windows, build-macos, build-linux]
    if: ${{ inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: List Artifacts
        run: |
          find artifacts -type f

      - name: Create Release And Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MANUAL_BUILD_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.tag_suffix }}
          name: ${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.release_name_suffix }}
          body: ${{ needs.prepare.outputs.release_body }}
          draft: true
          prerelease: false
          files: |
            ./artifacts/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_Windows/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}.zip
            ./artifacts/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_Windows/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}.zip.sha256
            ./artifacts/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_x86_64/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_x86_64.dmg
            ./artifacts/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_arm64/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_macOS_arm64.dmg
            ./artifacts/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_Linux_x86_64/${{ needs.prepare.outputs.app_name }}_${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.asset_suffix }}_Linux_x86_64.AppImage

  notify:
    needs: [prepare, build-windows, build-macos, build-linux, create-release]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          BUILD_STATUS="${{ needs.build-windows.result }}/${{ needs.build-macos.result }}/${{ needs.build-linux.result }}"
          if [ "${{ needs.build-windows.result }}" = "success" ] && \
             [ "${{ needs.build-macos.result }}" = "success" ] && \
             [ "${{ needs.build-linux.result }}" = "success" ]; then
            ICON="✅"
            STATUS="success"
          else
            ICON="❌"
            STATUS="failed"
          fi
          VERSION="${{ needs.prepare.outputs.version }}"
          BUILD_LABEL="${{ needs.prepare.outputs.release_label }}"
          TARGET_REF="${{ inputs.ref }}"
          TEXT=$(printf '[GitHub] %s LinguaGacha build %s\nVersion: %s\nBuild: %s\nRef: %s\nWindows/macOS/Linux: %s' "$ICON" "$STATUS" "$VERSION" "${BUILD_LABEL:-未填写}" "$TARGET_REF" "$BUILD_STATUS")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$TEXT" > /dev/null
